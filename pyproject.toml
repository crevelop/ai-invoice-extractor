[project]
name = "ai-invoice-extractor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pypdfium2>=5.11.0",
    "python-dotenv>=1.2.2",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

# The repo installs editable into .venv (uv sync), so `extractor`, `profiles`
# and `walkthrough` import from anywhere — scripts, tests, and the interactive
# window — with no sys.path bootstrapping in the lesson files.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extractor", "profiles", "walkthrough"]
